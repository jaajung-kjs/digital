services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ict-twin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-digital_next}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: digital-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ict-twin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL_NEXT: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/${DB_NAME:-digital_next}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-access-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # 사진 저장 루트 — 아래 uploads_data 볼륨 마운트 지점과 반드시 일치해야 한다.
      # WORKDIR 이 /app/backend 라 상대 경로로 두면 볼륨 밖(/app/backend/uploads)에 기록되어
      # 재배포마다 사진이 소실된다.
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (Nginx)
  frontend:
    image: digital-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ict-twin-frontend
    restart: unless-stopped
    ports:
      # 컨테이너 쪽은 반드시 8080 이다 — nginx 가 비루트(uid 101)로 실행되므로
      # 1024 미만 포트를 바인딩할 수 없어 nginx.conf 가 `listen 8080` 을 쓴다
      # (frontend/Dockerfile 의 EXPOSE 8080 과 짝). 여기를 :80 으로 두면 컨테이너는
      # 정상 기동하는데 어떤 요청도 닿지 않아 프론트가 통째로 먹통이 된다.
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

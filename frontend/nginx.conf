# Map for the WebSocket upgrade pattern. Without this, hardcoding
# `Connection: upgrade` on every proxied request leaves the upstream
# connection in a half-state for plain HTTP (no actual upgrade target),
# which on rootless podman + slirp4netns slowly accumulates connections
# in the userspace network proxy and starves the host CPU. With the
# map, regular HTTP requests cleanly send `Connection: close` and only
# real WebSocket upgrades carry `Connection: upgrade`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Increase buffer size for large headers/cookies
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # M-6: 의도적으로 백엔드 상한(50MB, background.routes.ts 의 MAX_FILE_SIZE)보다
    # 살짝 크게 잡는다 — 여기 맞추지 말 것. multipart 요청은 파일 바이트 자체보다
    # boundary·헤더만큼 더 크므로, 두 값이 같으면 상한 근처 파일에서 nginx 가
    # 백엔드보다 먼저 413(plain HTML)을 반환해 프론트의 apiErrorMessage 가 우리
    # FILE_TOO_LARGE 문구 대신 일반 오류 메시지를 띄운다. 우리 413(JSON)이 항상
    # 이기도록 여유를 둔다.
    client_max_body_size 52m;

    # API proxy
    #
    # `^~` 는 필수다. nginx 는 정규식 location 을 접두사 location 보다 먼저 평가하므로,
    # 이 접두사가 일반 `location /api` 이면 아래 정적 자산 정규식(.png|.jpg|…)이
    # `/api/v2/photos/<uuid>.png` 를 먼저 낚아채 프록시 대신 html 루트에서 찾다가
    # 404 를 낸다 — 프로덕션에서 사진이 전부 안 보이게 된다(개발은 vite 프록시라
    # 이 규칙이 없어 드러나지 않는다). `^~` 는 접두사가 맞으면 정규식 평가를 건너뛴다.
    location ^~ /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

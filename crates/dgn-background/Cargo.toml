[package]
name = "dgn-background"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[lib]
crate-type = ["cdylib"]

[dependencies]
ezdgn-core = { git = "https://github.com/monozukuri-ai/ezdgn", rev = "a7ca903d383dfb88b5b62c1535a38f21e093d848" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
